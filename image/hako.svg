<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.16  0 0 0 0 0.15  0 0 0 0 0.13  0 0 0 0.18 0"/>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="64" fill="#f5efe6"/>
  <rect width="512" height="512" rx="64" filter="url(#paperNoise)"/>
  <rect x="24" y="24" width="464" height="464" rx="48" fill="none" stroke="#d06a4c" stroke-width="10"/>
  <text x="256" y="360" font-family="Noto Serif JP, serif" font-size="320" font-weight="700" text-anchor="middle" fill="#2a2622">箱</text>
</svg>
